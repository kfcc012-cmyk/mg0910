<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="등록된 사내 FAQ를 키워드와 분류로 검색하는 도우미">
  <title>업무 FAQ 검색 도우미</title>
  <style>
    :root {
      --primary: #155eef;
      --primary-dark: #0b46ba;
      --primary-soft: #eef4ff;
      --text: #17213a;
      --muted: #667085;
      --line: #e4e7ec;
      --surface: #ffffff;
      --background: #f5f7fb;
      --highlight: #fff1a8;
      --shadow: 0 12px 32px rgba(16, 24, 40, 0.07);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(21, 94, 239, 0.08), transparent 30rem),
        var(--background);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }

    .page {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .header { margin-bottom: 28px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgba(21, 94, 239, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .subtitle { margin: 10px 0 0; color: var(--muted); }

    .app-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 16px;
      color: var(--primary);
      background: var(--surface);
      border: 1px solid #b2ccff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(21, 94, 239, 0.08);
      transition: color .2s, background .2s, border-color .2s, transform .1s;
    }

    .app-link:hover {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .app-link:active { transform: translateY(1px); }

    .app-link svg { width: 17px; height: 17px; }

    .search-panel {
      padding: 24px;
      background: var(--surface);
      border: 1px solid rgba(228, 231, 236, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .search-row { display: flex; gap: 10px; }

    .search-box { position: relative; flex: 1; }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 17px;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: #98a2b3;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 52px;
      padding: 0 48px;
      color: var(--text);
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #searchInput::placeholder { color: #98a2b3; }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21, 94, 239, 0.12);
    }

    .clear-button {
      position: absolute;
      top: 50%;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      color: #667085;
      background: transparent;
      border: 0;
      border-radius: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .clear-button:hover { background: #f2f4f7; }
    .clear-button[hidden] { display: none; }

    .view-all-button {
      min-width: 100px;
      height: 52px;
      padding: 0 18px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    .view-all-button:hover { background: var(--primary-dark); }
    .view-all-button:active { transform: translateY(1px); }

    .filter-wrap { margin-top: 22px; }

    .filter-label {
      display: block;
      margin-bottom: 10px;
      color: #344054;
      font-size: 14px;
      font-weight: 750;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter-button {
      min-width: 66px;
      padding: 8px 16px;
      color: #475467;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }

    .filter-button:hover { color: var(--primary); border-color: #84adff; }

    .filter-button.active {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: #84adff;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 34px 2px 14px;
    }

    .results-header h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .result-count { margin: 0; color: var(--muted); font-size: 14px; }
    .result-count strong { color: var(--primary); font-size: 16px; }

    .result-list { display: grid; gap: 14px; }

    .faq-card {
      padding: 24px 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(16, 24, 40, 0.035);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .faq-card:hover {
      border-color: #b2ccff;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.07);
      transform: translateY(-2px);
    }

    .card-top { display: flex; align-items: flex-start; gap: 14px; }

    .q-mark {
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      height: 32px;
      color: #fff;
      background: var(--primary);
      border-radius: 9px;
      font-weight: 850;
    }

    .question { flex: 1; margin: 1px 0 0; font-size: 18px; line-height: 1.55; letter-spacing: -0.02em; }

    .category-badge {
      flex: 0 0 auto;
      padding: 4px 10px;
      color: #344054;
      background: #f2f4f7;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 750;
    }

    .answer {
      margin: 16px 0 0 46px;
      padding-top: 16px;
      color: #475467;
      border-top: 1px solid #f0f1f3;
      white-space: pre-wrap;
    }

    mark {
      padding: 0 2px;
      color: inherit;
      background: var(--highlight);
      border-radius: 3px;
      font-weight: 750;
    }

    .empty-state {
      padding: 56px 24px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 50%;
      font-size: 23px;
      font-weight: 850;
    }

    .empty-state strong { display: block; margin-bottom: 5px; color: #344054; }
    .empty-state p { margin: 0; }

    @media (max-width: 640px) {
      .page { width: min(100% - 28px, 960px); padding: 38px 0 56px; }
      .search-panel { padding: 18px; }
      .search-row { flex-direction: column; }
      .view-all-button { width: 100%; }
      .results-header { align-items: flex-end; }
      .faq-card { padding: 20px 18px; }
      .card-top { display: grid; grid-template-columns: 32px 1fr; }
      .category-badge { grid-column: 2; justify-self: start; }
      .answer { margin-left: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="eyebrow">INTERNAL FAQ</div>
      <h1>업무 FAQ 검색</h1>
      <p class="subtitle">궁금한 업무 내용을 등록된 FAQ에서 빠르게 찾아보세요.</p>
      <a class="app-link" href="https://kfcc012-cmyk.github.io/mg0910/mgfaq" aria-label="금융계산기앱으로 이동">
        금융계산기앱
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <label for="searchInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">질문이나 키워드 검색</label>
          <input id="searchInput" type="search" placeholder="질문이나 키워드를 입력하세요." autocomplete="off">
          <button id="clearButton" class="clear-button" type="button" aria-label="검색어 지우기" title="검색어 지우기" hidden>×</button>
        </div>
        <button id="viewAllButton" class="view-all-button" type="button">전체보기</button>
      </div>

      <div class="filter-wrap">
        <span class="filter-label">분류</span>
        <div id="filters" class="filters" role="group" aria-label="FAQ 분류 선택">
          <button class="filter-button active" type="button" data-category="전체" aria-pressed="true">전체</button>
          <button class="filter-button" type="button" data-category="교육" aria-pressed="false">교육</button>
          <button class="filter-button" type="button" data-category="문서" aria-pressed="false">문서</button>
          <button class="filter-button" type="button" data-category="IT" aria-pressed="false">IT</button>
          <button class="filter-button" type="button" data-category="보안" aria-pressed="false">보안</button>
        </div>
      </div>
    </section>

    <section aria-labelledby="resultsTitle">
      <div class="results-header">
        <h2 id="resultsTitle">검색 결과</h2>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>
      <div id="resultList" class="result-list"></div>
    </section>
  </main>

  <script>
    // 첨부된 FAQ초안_합성자료.json의 데이터만 사용합니다.
    const faqData = [
      { category: "교육", question: "교육 신청은 어디에서 하나요?", answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다." },
      { category: "교육", question: "신청한 교육을 취소하려면 어떻게 하나요?", answer: "신청내역에서 취소 가능 여부를 확인합니다." },
      { category: "문서", question: "주간 업무보고에는 무엇을 넣어야 하나요?", answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다." },
      { category: "IT", question: "사내 시스템 접속이 되지 않습니다.", answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다." },
      { category: "보안", question: "ChatGPT에 내부 업무자료를 넣어도 되나요?", answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다." }
    ];

    const searchInput = document.getElementById("searchInput");
    const clearButton = document.getElementById("clearButton");
    const viewAllButton = document.getElementById("viewAllButton");
    const filters = document.getElementById("filters");
    const resultCount = document.getElementById("resultCount");
    const resultList = document.getElementById("resultList");
    let selectedCategory = "전체";

    function normalize(value) {
      return value.trim().toLocaleLowerCase("ko-KR");
    }

    function appendHighlightedText(element, text, keyword) {
      const normalizedKeyword = normalize(keyword);
      if (!normalizedKeyword) {
        element.textContent = text;
        return;
      }

      const lowerText = text.toLocaleLowerCase("ko-KR");
      let cursor = 0;
      let foundAt = lowerText.indexOf(normalizedKeyword);

      while (foundAt !== -1) {
        element.append(document.createTextNode(text.slice(cursor, foundAt)));
        const mark = document.createElement("mark");
        mark.textContent = text.slice(foundAt, foundAt + normalizedKeyword.length);
        element.append(mark);
        cursor = foundAt + normalizedKeyword.length;
        foundAt = lowerText.indexOf(normalizedKeyword, cursor);
      }
      element.append(document.createTextNode(text.slice(cursor)));
    }

    function makeCard(item, keyword) {
      const article = document.createElement("article");
      article.className = "faq-card";

      const top = document.createElement("div");
      top.className = "card-top";

      const qMark = document.createElement("span");
      qMark.className = "q-mark";
      qMark.textContent = "Q";
      qMark.setAttribute("aria-hidden", "true");

      const question = document.createElement("h3");
      question.className = "question";
      appendHighlightedText(question, item.question, keyword);

      const badge = document.createElement("span");
      badge.className = "category-badge";
      appendHighlightedText(badge, item.category, keyword);

      const answer = document.createElement("p");
      answer.className = "answer";
      appendHighlightedText(answer, item.answer, keyword);

      top.append(qMark, question, badge);
      article.append(top, answer);
      return article;
    }

    function render() {
      const rawKeyword = searchInput.value;
      const keyword = normalize(rawKeyword);
      const matches = faqData.filter((item) => {
        const categoryMatches = selectedCategory === "전체" || item.category === selectedCategory;
        const searchableText = `${item.question} ${item.answer} ${item.category}`.toLocaleLowerCase("ko-KR");
        return categoryMatches && (!keyword || searchableText.includes(keyword));
      });

      clearButton.hidden = rawKeyword.length === 0;
      resultCount.innerHTML = `총 <strong>${matches.length}</strong>건`;
      resultList.replaceChildren();

      if (matches.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `
          <div class="empty-icon" aria-hidden="true">?</div>
          <strong>등록된 FAQ에서 답변을 찾을 수 없습니다.</strong>
          <p>관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
        `;
        resultList.append(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      matches.forEach((item) => fragment.append(makeCard(item, rawKeyword)));
      resultList.append(fragment);
    }

    function selectCategory(category) {
      selectedCategory = category;
      filters.querySelectorAll(".filter-button").forEach((button) => {
        const isActive = button.dataset.category === category;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      render();
    }

    searchInput.addEventListener("input", render);
    filters.addEventListener("click", (event) => {
      const button = event.target.closest(".filter-button");
      if (button) selectCategory(button.dataset.category);
    });

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      render();
    });

    viewAllButton.addEventListener("click", () => {
      searchInput.value = "";
      selectCategory("전체");
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
