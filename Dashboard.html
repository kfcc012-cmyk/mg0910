<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Supabase public 스키마 기반 MG 금융 데이터 대시보드">
  <title>MG 금융 데이터 대시보드</title>
  <style>
    :root {
      --mg:#007a4d; --mg-dark:#07553c; --mint:#dff4eb; --lime:#b8d532;
      --ink:#17211d; --muted:#68756f; --line:#dfe7e3; --bg:#f4f7f5;
      --card:#fff; --danger:#c53c3c; --shadow:0 10px 30px rgba(16,54,40,.08);
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.app{min-height:100vh}
    header{background:linear-gradient(120deg,var(--mg-dark),var(--mg));color:#fff;padding:28px clamp(18px,4vw,52px) 38px}
    .header-row{max-width:1440px;margin:auto;display:flex;gap:24px;justify-content:space-between;align-items:flex-start}
    .eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:#c7eedf}.title{margin:7px 0 4px;font-size:clamp(27px,4vw,42px);letter-spacing:-.04em}
    .subtitle{margin:0;color:#d9eee7}.sync{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);padding:10px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
    .dot{width:9px;height:9px;border-radius:50%;background:#9be8c8;box-shadow:0 0 0 5px rgba(155,232,200,.15)}
    main{max-width:1440px;margin:-20px auto 0;padding:0 clamp(16px,3vw,36px) 48px}.toolbar{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .tabs{display:flex;gap:6px;overflow:auto;flex:1}.tab{border:0;background:transparent;padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:750;white-space:nowrap}.tab.active{background:var(--mg);color:#fff}
    .refresh{border:1px solid var(--line);background:#fff;color:var(--mg-dark);font-weight:800;border-radius:12px;padding:10px 14px}.refresh:hover{background:var(--mint)}
    .status{margin:14px 4px 0;font-size:13px;color:var(--muted)}.error{color:var(--danger)}
    .panel{display:none}.panel.active{display:block}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}
    .kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.kpi{padding:20px}.kpi-label{color:var(--muted);font-size:13px;font-weight:700}.kpi-value{display:block;margin-top:8px;font-size:29px;font-weight:900;letter-spacing:-.04em}.kpi-note{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.card{padding:20px;min-width:0}.card.wide{grid-column:1/-1}
    .card h2{font-size:17px;margin:0 0 4px}.card p{font-size:12px;color:var(--muted);margin:0 0 16px}.chart{height:280px;width:100%;display:block}
    .table-tools{display:flex;gap:10px;align-items:center;margin:18px 0 12px}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}.search:focus{border-color:var(--mg)}
    .count{font-size:13px;color:var(--muted);white-space:nowrap}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.data-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}.data-table th,.data-table td{padding:12px 14px;border-bottom:1px solid #edf1ef;text-align:left}.data-table th{position:sticky;top:0;background:#f3f8f5;color:var(--mg-dark);font-size:12px}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#f7fbf9}
    .badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--mint);color:var(--mg-dark);font-weight:800}.badge.bad{background:#fde8e8;color:#a72d2d}.empty{padding:36px;text-align:center;color:var(--muted)}
    .skeleton{height:90px;border-radius:18px;background:linear-gradient(90deg,#e9efec,#f7faf8,#e9efec);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}
    footer{max-width:1440px;margin:auto;padding:0 36px 32px;color:var(--muted);font-size:12px}
    @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.header-row{display:block}.sync{margin-top:18px;width:max-content}}
    @media(max-width:540px){header{padding-top:22px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:15px}.kpi-value{font-size:23px}.toolbar{align-items:stretch;flex-direction:column}.refresh{width:100%}.chart{height:230px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="header-row"><div><div class="eyebrow">MG DATA INSIGHT</div><h1 class="title">금융 데이터 대시보드</h1><p class="subtitle">Supabase public 스키마 실시간 조회 · 지점/조합원/수신/여신 통합 현황</p></div><div class="sync"><span class="dot"></span><span id="syncText">데이터 연결 중</span></div></div></header>
  <main>
    <div class="toolbar"><nav class="tabs" aria-label="대시보드 메뉴">
      <button class="tab active" data-panel="overview">종합현황</button><button class="tab" data-panel="branches">지점</button><button class="tab" data-panel="members">조합원</button><button class="tab" data-panel="accounts">예적금</button><button class="tab" data-panel="loans">대출</button><button class="tab" data-panel="transactions">거래</button><button class="tab" data-panel="rates">금리비교</button>
    </nav><button class="refresh" id="refreshBtn">↻ 새로고침</button></div>
    <div class="status" id="status">Supabase에서 데이터를 불러오고 있습니다.</div>
    <section class="panel active" id="overview">
      <div class="kpis" id="kpis"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="grid"><article class="card"><h2>지점별 조합원</h2><p>소속 지점별 조합원 수</p><canvas class="chart" id="memberChart"></canvas></article><article class="card"><h2>계좌 종류별 평균 잔액</h2><p>예·적금 상품군별 평균 잔액</p><canvas class="chart" id="accountChart"></canvas></article><article class="card"><h2>지점별 예·적금 총액</h2><p>지점별 계좌 잔액 합계</p><canvas class="chart" id="branchBalanceChart"></canvas></article><article class="card"><h2>대출 상태</h2><p>정상·연체·완제 구성</p><canvas class="chart" id="loanChart"></canvas></article></div>
    </section>
    <section class="panel" id="branches"></section><section class="panel" id="members"></section><section class="panel" id="accounts"></section><section class="panel" id="loans"></section><section class="panel" id="transactions"></section><section class="panel" id="rates"></section>
  </main>
  <footer>조회 전용 대시보드 · 전화번호 등 불필요한 개인정보는 조회하지 않습니다.</footer>
</div>
<script>
  const SUPABASE_URL='https://icggthyluhicpceuzdll.supabase.co';
  const SUPABASE_KEY='sb_publishable_tz0c3dJOw0IhnYpoxVVc6A_K28328SB';
  const TABLES={
    branches:{select:'branch_id,branch_name,region,manager_name',order:'branch_id'},
    members:{select:'member_id,name,birth_date,gender,join_date,branch_id',order:'member_id'},
    deposit_accounts:{select:'account_id,member_id,branch_id,account_type,open_date,balance,interest_rate',order:'account_id'},
    loans:{select:'loan_id,member_id,branch_id,loan_type,loan_amount,interest_rate,start_date,due_date,status',order:'loan_id'},
    transactions:{select:'transaction_id,account_id,transaction_date,transaction_type,amount,balance_after',order:'transaction_id'},
    deposit_rate_comparisons:{select:'id,financial_institution,sector_category,product_name,base_rate,max_preferential_rate,preferential_conditions,reference_at',order:'id'}
  };
  const labels={branch_id:'지점 ID',branch_name:'지점명',region:'권역',manager_name:'지점장',member_id:'조합원 번호',name:'조합원명',birth_date:'생년월일',gender:'성별',join_date:'가입일',account_id:'계좌 ID',account_type:'계좌 종류',open_date:'개설일',balance:'잔액',interest_rate:'금리',loan_id:'대출 ID',loan_type:'대출 종류',loan_amount:'대출금액',start_date:'대출일',due_date:'만기일',status:'상태',transaction_id:'거래 ID',transaction_date:'거래일시',transaction_type:'거래 종류',amount:'금액',balance_after:'거래 후 잔액',id:'ID',financial_institution:'금융기관명',sector_category:'권역 분류',product_name:'대표 상품명',base_rate:'기본금리',max_preferential_rate:'최고우대금리',preferential_conditions:'주요 우대 조건',reference_at:'기준일시'};
  const state={}; const moneyKeys=new Set(['balance','loan_amount','amount','balance_after']); const rateKeys=new Set(['interest_rate','base_rate','max_preferential_rate']);
  async function fetchTable(name){const cfg=TABLES[name];const url=new URL(`${SUPABASE_URL}/rest/v1/${name}`);url.searchParams.set('select',cfg.select);url.searchParams.set('order',`${cfg.order}.asc`);const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!res.ok)throw new Error(`${name}: ${res.status} ${await res.text()}`);return res.json()}
  function won(n){return `${Number(n||0).toLocaleString('ko-KR')}원`} function fmt(v,k){if(v==null)return '-';if(moneyKeys.has(k))return won(v);if(rateKeys.has(k))return `${Number(v).toFixed(2)}%`;if(k==='gender')return v==='F'?'여':'남';if(k==='reference_at'||k==='transaction_date')return new Date(v).toLocaleString('ko-KR');if(k==='status')return `<span class="badge ${v==='연체'?'bad':''}">${v}</span>`;return String(v)}
  function sum(rows,key){return rows.reduce((a,r)=>a+Number(r[key]||0),0)} function group(rows,key,valueKey,mode='count'){const m={};rows.forEach(r=>{const k=r[key]??'미지정';if(!m[k])m[k]=[];m[k].push(r)});return Object.entries(m).map(([label,rs])=>({label,value:mode==='sum'?sum(rs,valueKey):mode==='avg'?sum(rs,valueKey)/rs.length:rs.length}))}
  function branchName(id){return state.branches?.find(b=>b.branch_id===id)?.branch_name||`지점 ${id}`}
  function renderKPIs(){const totalBalance=sum(state.deposit_accounts,'balance'),activeLoans=state.loans.filter(x=>x.status!=='완제').length,overdue=state.loans.filter(x=>x.status==='연체').length;document.getElementById('kpis').innerHTML=`<div class="kpi"><span class="kpi-label">전체 조합원</span><strong class="kpi-value">${state.members.length.toLocaleString()}명</strong><span class="kpi-note">${state.branches.length}개 지점</span></div><div class="kpi"><span class="kpi-label">예·적금 총잔액</span><strong class="kpi-value">${won(totalBalance)}</strong><span class="kpi-note">${state.deposit_accounts.length}개 계좌</span></div><div class="kpi"><span class="kpi-label">보유 대출</span><strong class="kpi-value">${activeLoans}건</strong><span class="kpi-note">완제 제외</span></div><div class="kpi"><span class="kpi-label">연체 대출</span><strong class="kpi-value" style="color:${overdue?'var(--danger)':'var(--mg)'}">${overdue}건</strong><span class="kpi-note">전체 ${state.loans.length}건 중</span></div>`}
  function setupCanvas(canvas){const dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);return{c,w:rect.width,h:rect.height}}
  function barChart(id,data,{money=false,color='#007a4d'}={}){const {c,w,h}=setupCanvas(document.getElementById(id)),pad={l:62,r:16,t:18,b:62},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(...data.map(d=>d.value),1);c.font='12px system-ui';c.textAlign='right';c.fillStyle='#76827d';for(let i=0;i<=4;i++){const y=pad.t+ch-(ch*i/4),v=max*i/4;c.strokeStyle='#e8eeeb';c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(money?`${Math.round(v/10000)}만`:Math.round(v),pad.l-8,y+4)}const bw=Math.max(18,cw/data.length*.52);data.forEach((d,i)=>{const x=pad.l+(cw/data.length)*(i+.5)-bw/2,bh=d.value/max*ch,y=pad.t+ch-bh;c.fillStyle=color;c.beginPath();c.roundRect(x,y,bw,bh,7);c.fill();c.save();c.translate(x+bw/2,h-12);c.rotate(-.35);c.fillStyle='#4e5d57';c.textAlign='right';c.fillText(d.label,0,0);c.restore()})}
  function donutChart(id,data){const {c,w,h}=setupCanvas(document.getElementById(id)),cx=w/2,cy=h/2-6,r=Math.min(w,h)*.29,total=data.reduce((a,d)=>a+d.value,0),colors=['#007a4d','#e35d5d','#9dbd22','#4f8edc'];let a=-Math.PI/2;data.forEach((d,i)=>{const end=a+Math.PI*2*d.value/total;c.beginPath();c.arc(cx,cy,r,a,end);c.arc(cx,cy,r*.58,end,a,true);c.fillStyle=colors[i%colors.length];c.fill();a=end});c.font='800 22px system-ui';c.fillStyle='#17211d';c.textAlign='center';c.fillText(`${total}건`,cx,cy+7);c.font='12px system-ui';data.forEach((d,i)=>{const x=16+(i%2)*(w/2),y=h-32+Math.floor(i/2)*20;c.fillStyle=colors[i];c.fillRect(x,y-9,10,10);c.fillStyle='#52615b';c.textAlign='left';c.fillText(`${d.label} ${d.value}`,x+16,y)})}
  function renderCharts(){const memberByBranch=state.branches.map(b=>({label:b.branch_name.replace('지점',''),value:state.members.filter(m=>m.branch_id===b.branch_id).length}));const accountAvg=group(state.deposit_accounts,'account_type','balance','avg');const branchBalances=state.branches.map(b=>({label:b.branch_name.replace('지점',''),value:sum(state.deposit_accounts.filter(a=>a.branch_id===b.branch_id),'balance')}));const loans=group(state.loans,'status');barChart('memberChart',memberByBranch);barChart('accountChart',accountAvg,{money:true,color:'#73951b'});barChart('branchBalanceChart',branchBalances,{money:true,color:'#147eaa'});donutChart('loanChart',loans)}
  const panelMap={branches:'branches',members:'members',accounts:'deposit_accounts',loans:'loans',transactions:'transactions',rates:'deposit_rate_comparisons'};
  function displayRows(table,rows){if(table==='members')return rows.map(r=>({...r,branch_id:`${r.branch_id} · ${branchName(r.branch_id)}`}));if(table==='deposit_accounts'||table==='loans')return rows.map(r=>({...r,branch_id:`${r.branch_id} · ${branchName(r.branch_id)}`}));return rows}
  function renderTable(panelId,table){const panel=document.getElementById(panelId),rows=displayRows(table,state[table]||[]),cols=Object.keys(rows[0]||{});panel.innerHTML=`<div class="card wide" style="margin-top:16px"><h2>${panelId==='rates'?'정기예금 금리 비교':document.querySelector(`[data-panel="${panelId}"]`).textContent} 데이터</h2><p>Supabase public.${table} 실시간 조회 결과</p><div class="table-tools"><input class="search" type="search" placeholder="현재 표에서 검색" aria-label="${panelId} 데이터 검색"><span class="count">${rows.length}건</span></div><div class="table-wrap"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${labels[c]||c}</th>`).join('')}</tr></thead><tbody></tbody></table></div></div>`;const body=panel.querySelector('tbody'),input=panel.querySelector('input'),count=panel.querySelector('.count');const draw=q=>{const filtered=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q.toLowerCase())));count.textContent=`${filtered.length}건`;body.innerHTML=filtered.length?filtered.map(r=>`<tr>${cols.map(c=>`<td>${fmt(r[c],c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">검색 결과가 없습니다.</td></tr>`};draw('');input.addEventListener('input',e=>draw(e.target.value))}
  function renderAll(){renderKPIs();renderCharts();Object.entries(panelMap).forEach(([panel,table])=>renderTable(panel,table))}
  async function load(){const status=document.getElementById('status'),btn=document.getElementById('refreshBtn');btn.disabled=true;status.className='status';status.textContent='Supabase에서 최신 데이터를 불러오고 있습니다.';try{const names=Object.keys(TABLES),results=await Promise.allSettled(names.map(fetchTable));const failed=[];results.forEach((r,i)=>{state[names[i]]=r.status==='fulfilled'?r.value:[];if(r.status==='rejected')failed.push(names[i])});renderAll();const now=new Date();document.getElementById('syncText').textContent=`${now.toLocaleTimeString('ko-KR')} 동기화`;if(failed.length){status.className='status error';status.textContent=`일부 테이블 접근 제한: ${failed.join(', ')}. Supabase RLS/SELECT 정책을 확인하세요.`}else status.textContent=`${now.toLocaleString('ko-KR')} 기준 · 6개 public 테이블 조회 완료`;}catch(e){status.className='status error';status.textContent=`데이터 연결 실패: ${e.message}`}finally{btn.disabled=false}}
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.panel).classList.add('active');if(btn.dataset.panel==='overview')requestAnimationFrame(renderCharts)}));
  document.getElementById('refreshBtn').addEventListener('click',load);window.addEventListener('resize',()=>{if(document.getElementById('overview').classList.contains('active'))renderCharts()});load();
</script>
</body>
</html>
