<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조합원 관리 CRUD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .title {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .sub {
      color: #6b7280;
      margin-bottom: 22px;
    }
    .toolbar, .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.04);
    }
    .toolbar {
      padding: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    input, select, button {
      font: inherit;
    }
    input, select {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 10px 12px;
      background: #fff;
    }
    .search {
      min-width: 260px;
      flex: 1;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-primary { background: #0f766e; color: #fff; }
    .btn-secondary { background: #eef2f7; color: #374151; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-edit { background: #e0f2fe; color: #0369a1; }
    .card { overflow: hidden; }
    .status {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      color: #4b5563;
      font-size: 14px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #edf0f3;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-size: 13px;
      color: #475569;
    }
    td { font-size: 14px; }
    .actions { display: flex; gap: 7px; }
    .empty {
      text-align: center;
      padding: 36px;
      color: #6b7280;
    }

    dialog {
      width: min(560px, calc(100% - 28px));
      border: 0;
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    dialog::backdrop { background: rgba(15,23,42,.45); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-title { font-size: 20px; font-weight: 800; }
    .modal-body { padding: 20px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; color: #475569; }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 20px 20px;
    }
    .msg {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .msg.error { display:block; background:#fef2f2; color:#b91c1c; }
    .msg.ok { display:block; background:#ecfdf5; color:#047857; }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">조합원 관리</h1>
    <div class="sub">Supabase members 테이블 CRUD 관리 화면</div>

    <div class="toolbar">
      <input id="searchInput" class="search" placeholder="이름 또는 전화번호 검색" />
      <select id="branchFilter">
        <option value="">전체 지점</option>
      </select>
      <button class="btn-secondary" id="refreshBtn">새로고침</button>
      <button class="btn-primary" id="addBtn">+ 조합원 등록</button>
    </div>

    <div class="card">
      <div class="status" id="statusText">데이터를 불러오는 중...</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>조합원 번호</th>
              <th>이름</th>
              <th>성별</th>
              <th>생년월일</th>
              <th>가입일</th>
              <th>지점</th>
              <th>전화번호</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="memberTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <dialog id="memberDialog">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">조합원 등록</div>
      <button class="btn-secondary" id="closeBtn" type="button">닫기</button>
    </div>

    <form id="memberForm">
      <div class="modal-body">
        <div class="grid">
          <div class="field">
            <label for="memberId">조합원 번호</label>
            <input id="memberId" type="number" min="1" required />
          </div>

          <div class="field">
            <label for="name">이름</label>
            <input id="name" maxlength="100" required />
          </div>

          <div class="field">
            <label for="birthDate">생년월일</label>
            <input id="birthDate" type="date" required />
          </div>

          <div class="field">
            <label for="gender">성별</label>
            <select id="gender" required>
              <option value="">선택</option>
              <option value="M">남성</option>
              <option value="F">여성</option>
            </select>
          </div>

          <div class="field">
            <label for="joinDate">가입일</label>
            <input id="joinDate" type="date" required />
          </div>

          <div class="field">
            <label for="branchId">소속 지점</label>
            <select id="branchId" required></select>
          </div>

          <div class="field full">
            <label for="phone">전화번호</label>
            <input id="phone" placeholder="010-1234-5678" maxlength="30" required />
          </div>
        </div>

        <div id="formMsg" class="msg"></div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn-secondary" id="cancelBtn">취소</button>
        <button type="submit" class="btn-primary" id="saveBtn">저장</button>
      </div>
    </form>
  </dialog>

  <script>
    const SUPABASE_URL = 'https://icggthyluhicpceuzdll.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tz0c3dJOw0IhnYpoxVVc6A_K28328SB';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let members = [];
    let branches = [];
    let editMode = false;

    const $ = (id) => document.getElementById(id);

    function todayString() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    async function loadBranches() {
      const { data, error } = await db
        .from('branches')
        .select('branch_id, branch_name')
        .order('branch_id');

      if (error) throw error;

      branches = data || [];

      $('branchFilter').innerHTML =
        '<option value="">전체 지점</option>' +
        branches.map(b => `<option value="${b.branch_id}">${escapeHtml(b.branch_name)}</option>`).join('');

      $('branchId').innerHTML =
        '<option value="">지점 선택</option>' +
        branches.map(b => `<option value="${b.branch_id}">${escapeHtml(b.branch_name)}</option>`).join('');
    }

    async function loadMembers() {
      $('statusText').textContent = '데이터를 불러오는 중...';

      const { data, error } = await db
        .from('members')
        .select(`
          member_id,
          name,
          birth_date,
          gender,
          join_date,
          branch_id,
          phone,
          branches (
            branch_name
          )
        `)
        .order('member_id');

      if (error) {
        $('statusText').textContent = '조회 오류: ' + error.message;
        return;
      }

      members = data || [];
      renderMembers();
    }

    function renderMembers() {
      const keyword = $('searchInput').value.trim().toLowerCase();
      const branchId = $('branchFilter').value;

      const filtered = members.filter(m => {
        const textMatch =
          !keyword ||
          (m.name || '').toLowerCase().includes(keyword) ||
          (m.phone || '').toLowerCase().includes(keyword);

        const branchMatch =
          !branchId || String(m.branch_id) === String(branchId);

        return textMatch && branchMatch;
      });

      $('statusText').textContent = `총 ${filtered.length}명 / 전체 ${members.length}명`;

      if (!filtered.length) {
        $('memberTbody').innerHTML =
          '<tr><td colspan="8" class="empty">조회된 조합원이 없습니다.</td></tr>';
        return;
      }

      $('memberTbody').innerHTML = filtered.map(m => `
        <tr>
          <td>${m.member_id}</td>
          <td>${escapeHtml(m.name)}</td>
          <td>${m.gender === 'M' ? '남성' : m.gender === 'F' ? '여성' : escapeHtml(m.gender || '')}</td>
          <td>${escapeHtml(m.birth_date || '')}</td>
          <td>${escapeHtml(m.join_date || '')}</td>
          <td>${escapeHtml(m.branches?.branch_name || '-')}</td>
          <td>${escapeHtml(m.phone || '')}</td>
          <td>
            <div class="actions">
              <button class="btn-edit" onclick="openEdit(${m.member_id})">수정</button>
              <button class="btn-danger" onclick="deleteMember(${m.member_id})">삭제</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function getNextMemberId() {
      const { data, error } = await db
        .from('members')
        .select('member_id')
        .order('member_id', { ascending: false })
        .limit(1);

      if (error) throw error;
      return data?.length ? Number(data[0].member_id) + 1 : 1;
    }

    async function openCreate() {
      editMode = false;
      $('memberForm').reset();
      clearMessage();

      $('modalTitle').textContent = '조합원 등록';
      $('memberId').disabled = false;
      $('joinDate').value = todayString();

      try {
        $('memberId').value = await getNextMemberId();
      } catch (e) {
        showMessage('다음 조합원 번호 조회 실패: ' + e.message, true);
      }

      $('memberDialog').showModal();
    }

    window.openEdit = function(memberId) {
      const m = members.find(x => Number(x.member_id) === Number(memberId));
      if (!m) return;

      editMode = true;
      clearMessage();

      $('modalTitle').textContent = '조합원 수정';
      $('memberId').value = m.member_id;
      $('memberId').disabled = true;
      $('name').value = m.name || '';
      $('birthDate').value = m.birth_date || '';
      $('gender').value = m.gender || '';
      $('joinDate').value = m.join_date || '';
      $('branchId').value = m.branch_id || '';
      $('phone').value = m.phone || '';

      $('memberDialog').showModal();
    };

    $('memberForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const payload = {
        name: $('name').value.trim(),
        birth_date: $('birthDate').value,
        gender: $('gender').value,
        join_date: $('joinDate').value,
        branch_id: Number($('branchId').value),
        phone: $('phone').value.trim()
      };

      if (!payload.name || !payload.birth_date || !payload.gender ||
          !payload.join_date || !payload.branch_id || !payload.phone) {
        showMessage('필수 항목을 모두 입력해 주세요.', true);
        return;
      }

      $('saveBtn').disabled = true;

      try {
        let result;

        if (editMode) {
          result = await db
            .from('members')
            .update(payload)
            .eq('member_id', Number($('memberId').value))
            .select();
        } else {
          payload.member_id = Number($('memberId').value);
          result = await db
            .from('members')
            .insert(payload)
            .select();
        }

        if (result.error) throw result.error;

        showMessage(editMode ? '수정되었습니다.' : '등록되었습니다.');
        await loadMembers();

        setTimeout(() => $('memberDialog').close(), 500);
      } catch (e) {
        showMessage('저장 실패: ' + e.message, true);
      } finally {
        $('saveBtn').disabled = false;
      }
    });

    window.deleteMember = async function(memberId) {
      const m = members.find(x => Number(x.member_id) === Number(memberId));
      const label = m ? `${m.name} (${memberId}번)` : `${memberId}번`;

      if (!confirm(`${label} 조합원을 삭제하시겠습니까?\n\n예적금 또는 대출 데이터가 연결되어 있으면 삭제가 차단될 수 있습니다.`)) {
        return;
      }

      const { error } = await db
        .from('members')
        .delete()
        .eq('member_id', memberId);

      if (error) {
        alert(
          '삭제 실패\n\n' +
          error.message +
          '\n\n연결된 예적금/대출 데이터가 있는 경우 먼저 해당 데이터를 처리해야 합니다.'
        );
        return;
      }

      await loadMembers();
      alert('삭제되었습니다.');
    };

    function showMessage(text, isError = false) {
      const el = $('formMsg');
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'error' : 'ok');
    }

    function clearMessage() {
      $('formMsg').textContent = '';
      $('formMsg').className = 'msg';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    $('searchInput').addEventListener('input', renderMembers);
    $('branchFilter').addEventListener('change', renderMembers);
    $('refreshBtn').addEventListener('click', loadMembers);
    $('addBtn').addEventListener('click', openCreate);
    $('closeBtn').addEventListener('click', () => $('memberDialog').close());
    $('cancelBtn').addEventListener('click', () => $('memberDialog').close());

    async function init() {
      try {
        await loadBranches();
        await loadMembers();
      } catch (e) {
        $('statusText').textContent = '초기화 오류: ' + e.message;
      }
    }

    init();
  </script>
</body>
</html>
